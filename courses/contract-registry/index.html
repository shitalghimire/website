<!-- ══════════ THE GATE ══════════ -->
<section class="gate" id="gate" aria-labelledby="gateTitle">
  <div class="gate__art" id="gateArt" aria-hidden="true"></div>

  <div class="gate__file">
    <div class="gate__seal" aria-hidden="true"><i>R</i><i>R</i></div>
    <p class="gate__kicker">Private file · by code only</p>
    <h1 class="gate__title" id="gateTitle">The Registry</h1>
    <p class="gate__lede">Real claims, letter by letter. Every clause in plain words. Break the seal to come in.</p>

    <form class="gate__form" id="gateForm" novalidate>
      <label class="gate__label" for="gateCode">Access code</label>
      <div class="gate__row">
        <input class="gate__input" id="gateCode" type="password"
               autocomplete="current-password" spellcheck="false" placeholder="· · · · · · · ·"
               aria-describedby="gateMsg"/>
        <button class="btn" id="gateGo" type="submit">Break the seal</button>
      </div>
      <label class="gate__remember">
        <input type="checkbox" id="gateRemember"/> <span>Keep it open on this device</span>
      </label>
      <p class="gate__msg" id="gateMsg" role="status" aria-live="polite"></p>
    </form>

    <footer class="gate__foot">
      <a href="../index.html">← All courses</a>
      <span>Encrypted at rest · AES-256</span>
    </footer>
  </div>
</section>

<noscript><p class="noscript">This course needs JavaScript.</p></noscript>
<script>
/* The access code changed on 18 Sept 2026. Once per device, before any cached
   script runs, a code remembered from before then is kept aside so sync can
   move synced progress across to the new code (see courses/sync/sync.js). */
try {
  if (localStorage.getItem('courses-sync:gen') !== '2') {
    var k = 'courses-sync:old-codes', list = JSON.parse(localStorage.getItem(k) || '[]');
    ['delay-analysis:unlocked', 'registry:unlocked'].forEach(function (key) {
      [sessionStorage.getItem(key), localStorage.getItem(key)].forEach(function (c) { if (c && list.indexOf(c) < 0) list.unshift(c); });
    });
    if (list.length) localStorage.setItem(k, JSON.stringify(list.slice(0, 3)));
    localStorage.setItem('courses-sync:gen', '2');
  }
} catch (e) { /* storage unavailable */ }
</script>
