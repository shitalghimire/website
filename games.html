<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Descent — Shital Ghimire</title>
<meta name="description" content="Descent: a vertical arcade shooter built from scratch for the browser. Your boots are the gun — fire down to kill and to break your fall."/>
<meta name="theme-color" content="#14150F"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="assets/icon-180.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/base.css"/>
<link rel="stylesheet" href="css/descent.css"/>
</head>
<body class="descent">

<header class="dbar">
  <a class="dbar__back" href="index.html">&larr; Portfolio</a>
  <p class="dbar__title">DESC<i>E</i>NT</p>
  <div class="dbar__acts">
    <button class="dbar__act" id="musBtn" aria-pressed="true">Music on</button>
    <button class="dbar__act" id="sndBtn" aria-pressed="true">Sound on</button>
  </div>
</header>

<main class="dstage">

  <!-- ══════ left rail: progress ══════ -->
  <aside class="rail rail--l" id="hud">
    <div class="read read--big">
      <dt>Depth</dt>
      <dd><b id="hDepth">0</b><small>m</small></dd>
    </div>
    <p class="zone" id="hZone">THE LIP</p>

    <div class="read">
      <dt>Score</dt>
      <dd id="hScore">0</dd>
    </div>
    <div class="read">
      <dt>Gems</dt>
      <dd id="hGems">0</dd>
    </div>
    <div class="read read--dim">
      <dt>Best</dt>
      <dd><span id="hBest">0</span><small>m</small></dd>
    </div>

    <!-- vitals sit in the same container so the HUD is one sync -->
    <div class="vitals">
      <div class="vital">
        <dt>Health</dt>
        <dd class="pips" id="hHearts"></dd>
      </div>
      <div class="vital">
        <dt>Ammo</dt>
        <dd class="pips pips--ammo" id="hAmmo"></dd>
      </div>
    </div>

    <div class="combo" id="hCombo">
      <dt>Combo</dt>
      <dd>&times;<b id="hComboN">0</b></dd>
    </div>

    <div class="perkrow" id="hPerks"></div>
  </aside>

  <!-- ══════ the shaft ══════ -->
  <div class="dplay">
    <canvas id="cv" width="320" height="560" aria-label="Descent game"></canvas>

    <!-- the surveyor, in play. Slides in, says one line, slides out.
         Takes no input and never pauses the run. -->
    <aside class="tx" id="tx" aria-live="polite">
      <div class="tx__port" id="txPort"></div>
      <div class="tx__body">
        <p class="tx__who" id="txWho"></p>
        <p class="tx__line" id="txLine"></p>
      </div>
    </aside>

    <div class="ov" id="ov" hidden>
      <div class="ov__panel" id="ovBody"></div>
    </div>
  </div>

</main>

<!-- ══════ touch controls ══════ -->
<div class="pads" aria-hidden="true">
  <button class="pad pad--l" id="padL">&larr;</button>
  <button class="pad pad--f" id="padF">FIRE</button>
  <button class="pad pad--r" id="padR">&rarr;</button>
</div>

<script type="module" src="js/descent/main.js"></script>
</body>
</html>
